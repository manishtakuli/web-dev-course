<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css selector</title>
</head>
<style>
    /*element selector 
    div {
        color: green;
    }
    /*class selector */
    .darkgreen{
       color: darkgreen;
    }
    /*id selector */
    #green{
        color: rgb(180, 92, 239);
    }
    /* child selector */
    div >p{
        color: blue;
        background-color: rgb(214, 9, 193);
    }
    /* descendent selector */
    div p{
         color: blue;
        background-color: rgb(236, 165, 229);
    }
    /*universal selector */
    *{
        margin: 0%;
        padding: 0%;
    }
     /* peseudo selector */
     a:visited{
        color: gold;
     }
     a:link{
        color: rgb(250, 27, 23);
     }   
     
</style>
<body>
    <div class = "darkgreen" > i am div </div>
    <div id = "green" > i am div
        <article>
             <p> hello my name is developer</p>
         </article>
    </div>
    <a href="www.amazon.com">amazon</a>
</body>
</html>
